[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "B008",  # function calls in default arguments (QFont weights)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "monitors", "services", "ui", "utils"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
